<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Available Courts - Cyberjaya Sports Center</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .court-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; margin-top: 30px; }
        .court-card { border-radius: 12px; overflow: hidden; transition: var(--transition); }
        .court-card:hover { transform: translateY(-5px); box-shadow: var(--shadow); }
        .court-img { width: 100%; height: 200px; object-fit: cover; background: #ddd; }
        .court-info { padding: 20px; }
        .price-tag { color: var(--primary-color); font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>
    <header>
        <div style="display:flex; align-items:center; gap:15px;">
            <a href="index.html"><img src="images/LogoTopLeft.png" alt="Logo" class="header-logo"></a>
            <h1 style="margin:0; border:none;">Cyberjaya Sports Center</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="court_list.html" class="active">Book a Court</a></li>
                <li><a href="user_dashboard.html">My Account</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="card">
            <h2>Find Your Court</h2>
            <p>Browse our world-class facilities and start your booking.</p>
            <div id="courtContainer" class="court-grid">
                </div>
        </div>
    </main>

    <script>
        window.onload = function() {
            const facilities = JSON.parse(localStorage.getItem("facilityList")) || [];
            const container = document.getElementById("courtContainer");

            if (facilities.length === 0) {
                container.innerHTML = "<p>No courts available at the moment.</p>";
                return;
            }

            container.innerHTML = facilities.map(fac => `
                <div class="card court-card">
                    <div class="court-img" style="background: var(--primary-color); display:flex; align-items:center; justify-content:center; color:white;">
                        <span style="font-size:3rem;">🏸</span>
                    </div>
                    <div class="court-info">
                        <h3>${fac.name}</h3>
                        <p>Category: ${fac.type}</p>
                        <p class="price-tag">RM ${fac.price} / hour</p>
                        <button onclick="selectCourt('${fac.name}', '${fac.price}')" style="width:100%; margin-top:10px;">Book Now</button>
                    </div>
                </div>
            `).join('');
        };

        function selectCourt(name, price) {
            localStorage.setItem("selectedCourt", name);
            localStorage.setItem("selectedPrice", price);
            window.location.href = "checkout.html";
        }
    </script>
</body>
</html>
