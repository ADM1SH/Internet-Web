<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sales Report - Probook Sports</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="admin-wrapper">
        <div class="sidebar">
            <div style="background:white; padding:10px; border-radius:10px; margin-bottom:20px; text-align:center;"><img src="images/LogoTopLeft.png" alt="Logo" style="height: 40px;"></div><h2 style="border:none; margin:10px 0; font-size:1.2rem; color:white; text-align:center;">Probook Admin</h2>
            <a href="admin_dashboard.html" class="nav-link">Dashboard Overview</a>
            <a href="manage_bookings.html" class="nav-link">Manage Bookings</a>
            <a href="manage_facilities.html" class="nav-link">Court Settings</a>
            <a href="manage_players.html" class="nav-link">Manage Players</a>
            <a href="manage_staff.html" class="nav-link">Manage Staff</a>
            <a href="sales_report.html" class="nav-link active">Sales Report</a>
            <div style="margin-top: auto;">
                <a href="index.html" class="nav-link" style="color: #ffab91;">Logout</a>
            </div>
        </div>

        <div class="main-content-area">
            <h1>Sales Report & Revenue Overview</h1>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Monthly Revenue</h3>
                    <div class="stat-number" id="monthlyRevenue">RM 0</div>
                </div>
                <div class="stat-card">
                    <h3>Total Bookings</h3>
                    <div class="stat-number" id="totalBookings">0</div>
                </div>
                <div class="stat-card">
                    <h3>Avg. per Booking</h3>
                    <div class="stat-number" id="avgRevenue">RM 0</div>
                </div>
            </div>

            <div class="card">
                <h2>Revenue Breakdown</h2>
                <table id="salesTable">
                    <thead>
                        <tr>
                            <th>Month</th>
                            <th>Total Bookings</th>
                            <th>Total Revenue (RM)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/checkout.js"></script>
    <script src="js/sales_report.js"></script>
</body>
</html>
